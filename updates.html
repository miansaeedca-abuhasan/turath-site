<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تراث خیرالقرون نئی اپڈیٹس</title>
<style>
@font-face{font-family:"Jameel Noori Nastaleeq";src:local("Jameel Noori Nastaleeq"),url("fonts/JameelNooriNastaleeq.woff2") format("woff2")}
@font-face{font-family:"Noto Nastaliq Urdu";src:url("fonts/NotoNastaliqUrdu.woff") format("woff")}
:root{--ink:#16222c;--muted:#5d6b75;--paper:#f3f6fa;--card:#fff;--accent:#0b5d4b;--line:#dbe3ea;--gold:#c9a24a;--blue:#2a6db0;--hd1:#0b5d4b;--hd2:#2f7a5f;--wm:.07}
@media (prefers-color-scheme:dark){:root{--ink:#e8eceb;--muted:#9aa8b0;--paper:#0f161b;--card:#18222a;--accent:#7fd0b0;--line:#2a3944;--blue:#74b6e6;--hd1:#0a3d33;--hd2:#14574a;--wm:.05}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,sans-serif;position:relative;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:url(icon-512.png) center 55%/min(80vw,420px) no-repeat;opacity:var(--wm);pointer-events:none;z-index:0}
header.hd{position:relative;z-index:1;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:14px 16px 18px;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hdin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hdin img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
header h1{flex:1;margin:0;font-size:1.45rem;line-height:1.9;color:#fff}
header a.back{color:#fff;text-decoration:none;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:.1rem .9rem;font-size:.95rem;white-space:nowrap}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 16px 56px}
article{position:relative;background:var(--card);border:1.5px solid var(--gold);border-radius:18px;padding:16px 20px 14px;margin:20px 0;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(201,162,74,.55),0 2px 12px rgba(20,40,70,.08)}
article time{display:inline-block;color:#fff;background:var(--blue);border-radius:999px;padding:0 .9rem;font-size:.82rem;line-height:1.9;direction:ltr;letter-spacing:.03em}
article h2{font-size:1.2rem;color:var(--accent);margin:.5rem 0 .4rem;padding-bottom:.3rem;border-bottom:3px double var(--gold);width:fit-content;padding-inline-end:1.6em}
article h2:before{content:"۞";color:var(--gold);margin-inline-end:.5rem;font-size:.9em}
article ul{list-style:none;margin:.3rem 0;padding:0}
article li{position:relative;padding:.35rem 1.9rem .35rem 0;border-bottom:1px dashed var(--line)}
article li:last-child{border-bottom:0}
[dir=ltr] article li{padding:.35rem 0 .35rem 1.9rem}
article li:before{content:"✦";position:absolute;inset-inline-start:0;top:.45rem;color:var(--gold);font-size:1.05rem;line-height:1.8}
[dir=rtl] article li:before{right:0;left:auto}[dir=ltr] article li:before{left:0}
article li a{color:var(--ink);text-decoration:none}
article li a:hover,article li a:active{color:var(--blue)}
.ur{font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif;line-height:2.3}
@media (max-width:640px){article{padding:14px 14px 10px;border-radius:14px}header h1{font-size:1.2rem}}
</style>
</head>
<body><header class="hd"><div class="hdin"><img src="icon-192.png" alt=""><h1 id="h">تراث خیرالقرون نئی اپڈیٹس</h1><a class="back" href="./" id="back">→</a></div></header>
<main id="m">
<div id="list"></div>
</main>
<script>
(function(){
var ui='ur';try{ui=localStorage.ui||'ur'}catch(e){}
var T={ur:'تراث خیرالقرون نئی اپڈیٹس',ar:'تراث خير القرون: آخر التحديثات',en:'Turath Khair al-Quroon: What’s new'};
var H=T[ui]||T.en, rtl=(ui==='ur'||ui==='ar');
document.documentElement.lang=ui;document.documentElement.dir=rtl?'rtl':'ltr';
document.title=H;document.getElementById('h').textContent=H;
if(ui==='ur'){document.getElementById('m').classList.add('ur');document.getElementById('h').classList.add('ur');}
fetch('news.json').then(function(r){return r.json()}).then(function(N){
  var L=document.getElementById('list');
  N.forEach(function(n){
    var a=document.createElement('article'),d=document.createElement('time');d.textContent=n.d;a.append(d);
    var h=document.createElement('h2');h.textContent=(n.t&&(n.t[ui]||n.t.en||n.t.ur))||'';a.append(h);
    var is=(n.i&&(n.i[ui]||n.i.en||n.i.ur))||[],u=document.createElement('ul');
    is.forEach(function(x,ix){var li=document.createElement('li'),h=n.l&&n.l[ix];if(h){var A=document.createElement('a');A.href=/^https?:/.test(h)?h:'./'+h;if(/^https?:/.test(h)){A.target='_blank';A.rel='noopener'}A.textContent=x;li.append(A)}else li.textContent=x;u.append(li)});a.append(u);
    L.append(a);
  });
}).catch(function(){document.getElementById('list').textContent='…'});
})();
</script>
<script src="copybar.js?v=1"></script>
</body>
</html>
