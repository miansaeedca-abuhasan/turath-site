<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>تربیہ — تراث خيرالقرون</title>
<style>
@font-face{font-family:"Jameel Noori Nastaleeq";src:local("Jameel Noori Nastaleeq"),url("fonts/JameelNooriNastaleeq.woff2") format("woff2")}
@font-face{font-family:"Noto Nastaliq Urdu";src:url("fonts/NotoNastaliqUrdu.woff") format("woff")}
:root{--ink:#1c2b25;--muted:#5d6f66;--paper:#f5f0e1;--card:#fffdf5;--accent:#0e5a45;--gold:#c39a3b;--soft:#e8f1ea;--line:#e4dbc0;--good:#1f7a4d;--bad:#b3261e;--c0:#2b7bb9;--c1:#c0762c;--c2:#6a4fb3;--c3:#17786e;--c4:#c0392b;--c5:#8a6d1d;--c6:#3b6e2f;--c7:#7a3b6e}
@media (prefers-color-scheme:dark){:root{--ink:#e9f1ec;--muted:#9db1a7;--paper:#0c1814;--card:#13251e;--accent:#5fc7a0;--gold:#d8b865;--soft:#173128;--line:#27403a;--good:#6fcf8f;--bad:#f08a80;--c0:#6bb4ea;--c1:#e0a05a;--c2:#a58cf0;--c3:#5fd1c0;--c4:#f08a80;--c5:#d8b865;--c6:#8bd07c;--c7:#d696c8}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,sans-serif}
html[lang=ur] body{font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif;line-height:2.1}
main{max-width:900px;margin:0 auto;padding:10px 14px 60px}
header.top{display:flex;align-items:center;gap:10px;padding:8px 0}
header.top img{width:44px;height:44px}
header.top h1{font-size:1.3rem;margin:0;flex:1;color:var(--accent)}
header.top small{display:block;color:var(--muted);font-size:.8em;line-height:1.6}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 8px rgba(20,40,70,.08)}
h2{font-size:1.08rem;color:var(--accent);margin:.2rem 0 .5rem}
button,input,select{font:inherit;color:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 16px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f161b}}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:2px 10px;font-size:.9rem}
button:disabled{opacity:.45;cursor:default}
input,select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px 0 8px}
label{display:block;font-size:.92rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.muted{color:var(--muted);font-size:.9rem}
.hero{background:linear-gradient(135deg,var(--accent),#1c8a68);color:#fff;border-radius:18px;padding:18px;margin:10px 0}
.hero h2{color:#fff;font-size:1.25rem}.hero p{margin:.3rem 0;opacity:.95}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:2px}
.tabs button{flex:1 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.tabs button.on{color:#0f161b}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:3px 12px}
.chips button.on{background:var(--gold);color:#1c2b25;border-color:var(--gold)}
.nav{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0}.nav b{min-width:12em;text-align:center}
/* the chart (like the poster on the wall): activities in rows, children in columns */
.grid{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
table.ch{border-collapse:separate;border-spacing:0;width:100%;min-width:100%}
table.ch th,table.ch td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
table.ch th.act,table.ch td.act{text-align:start;position:sticky;inset-inline-start:0;background:var(--card);min-width:9.5em;max-width:13em;z-index:1;font-size:.98rem}
table.ch thead th{font-size:1.02rem;border-bottom:2px solid var(--line)}
table.ch thead th .kid{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;background:var(--kc)}
@media (prefers-color-scheme:dark){table.ch thead th .kid{color:#0f161b}}
table.ch tr.neg td,table.ch tr.neg th{background:color-mix(in srgb,var(--bad) 8%,var(--card))}
table.ch tr.sum td,table.ch tr.sum th{font-weight:700;border-bottom:0;background:var(--soft)}
.cell{display:inline-flex;align-items:center;gap:4px}
.cell button{width:34px;height:34px;padding:0;border-radius:50%;font-size:1.2rem;line-height:1}
.cell button.m{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ch tr.secr th{text-align:start;background:var(--soft);color:var(--accent);font-size:.95rem;padding:4px 10px}
.wk th,.wk td{padding:5px 2px!important;font-size:.85rem}.wk th.act,.wk td.act{min-width:6.2em!important;max-width:7.5em!important;padding:5px 8px!important;font-size:.88rem;line-height:1.7}.wk thead th small{display:block;font-size:.72rem;line-height:1.3}.wk thead th .kid{padding:0 8px;font-size:.85rem}
.cell .v{min-width:2.2em;font-weight:700;font-size:1.1rem}
.cell .v.on{color:var(--good)}.neg .cell .v.on{color:var(--bad)}
.lock{color:var(--muted);font-size:.8rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;background:var(--kc)}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi>div{flex:1 1 130px;background:var(--soft);border-radius:14px;padding:8px 12px;text-align:center}.kpi b{display:block;font-size:1.5rem}
svg.gr{width:100%;height:auto;display:block}
svg.gr text{font-family:inherit;fill:var(--muted);font-size:11px}
.word{border-radius:14px;background:var(--soft);padding:10px 14px;margin:8px 0}
.codebox{font:700 1.5rem/1.4 ui-monospace,Menlo,monospace;letter-spacing:.2em;direction:ltr;background:var(--paper);border:2px dashed var(--gold);border-radius:12px;padding:6px 14px;display:inline-block}
.err{color:var(--bad);margin:4px 0}
.set .li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0}.set .li input{flex:1 1 160px;margin:0}
.tag{font-size:.75rem;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--accent)}.tag.n{background:color-mix(in srgb,var(--bad) 15%,var(--paper));color:var(--bad)}
/* the certificate */
.cert{background:#fffdf3;color:#1c2b25;border:3px double #b88a2a;border-radius:6px;padding:26px 20px;text-align:center;position:relative;margin:10px 0}
.cert:before{content:"";position:absolute;inset:8px;border:1.5px solid #d9b45a;pointer-events:none}
.cert .bis{font-size:1.1rem;color:#0e5a45}.cert h2{color:#8a6410;font-size:1.7rem;margin:.3rem 0}
.cert .nm{font-size:2rem;color:#0e5a45;margin:.2rem 0;border-bottom:2px dotted #d9b45a;display:inline-block;padding:0 24px}
.cert .stars{font-size:2.2rem;color:#d19a1c;letter-spacing:.2em;margin:.2rem 0}
.cert .big{font-size:1.15rem}.cert .sg{display:flex;justify-content:space-around;margin-top:18px;font-size:.95rem;color:#5d6f66}.cert .sg span{border-top:1px solid #b88a2a;padding:2px 24px;min-width:9em}
.cert .by{font-size:.78rem;color:#7a8a82;margin-top:10px}
@media print{body{background:#fff}header.top,.tabs,.noprint,.chips,.nav,.card:not(.printme){display:none!important}main{padding:0;max-width:none}.cert{margin:0;page-break-inside:avoid}@page{size:A4 landscape;margin:12mm}}
</style>

    svg+='<rect x="'+x+'" y="'+(H-hp)+'" width="'+bw+'" height="'+hp+'" rx="6" style="fill:var('+c+')"/><rect x="'+(x+bw)+'" y="'+(H-hn)+'" width="'+bw+'" height="'+hn+'" rx="6" fill="var(--bad)" opacity=".75"/>';

function lineChart(kids,r){
  // buckets: days for week/month, weeks for quarter, months for half-year/year
  const B=[];if(r.days<=31){for(let d=new Date(r.s);d<=r.e;d=addDays(d,1))B.push([new Date(d),new Date(d),String(d.getDate())])}
  else if(pk==='quarter'){for(let d=new Date(r.s);d<=r.e;d=addDays(d,7)){const e=addDays(d,6);B.push([new Date(d),e>r.e?r.e:e,UD(d.getDate())+'/'+UD(d.getMonth()+1)])}}
  else{for(let m=new Date(r.s);m<=r.e;m=new Date(m.getFullYear(),m.getMonth()+1,1))B.push([new Date(m),new Date(m.getFullYear(),m.getMonth()+1,0),MONTHS[m.getMonth()].slice(0,3)])}
  if(B.length<2)return null;
  const series=kids.map(k=>B.map(([s,e])=>totals(k.id,s,e).net)),mx=Math.max(1,...series.flat()),mn=Math.min(0,...series.flat()),W=520,H=170,L=26;
  const X=i=>L+(W-L-10)*i/(B.length-1),Y=v=>10+(H-10)*(1-(v-mn)/(mx-mn||1));
  let s='<svg class="gr" viewBox="0 0 '+W+' '+(H+26)+'">';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" opacity=".12"/><text x="0" y="'+(y+4)+'">'+UD(Math.round(v))+'</text>'}
  const step=Math.ceil(B.length/10);B.forEach((b,i)=>{if(i%step===0)s+='<text x="'+X(i)+'" y="'+(H+16)+'" text-anchor="middle">'+(r.days<=31?UD(b[2]):b[2])+'</text>'});
  kids.forEach((k,j)=>{const c=kidColor(k.id).replace('var(','').replace(')','');s+='<polyline fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var('+c+')" points="'+series[j].map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>'});
  s+='</svg>';
  return E('div',{},E('div',{html:s}),E('div',{class:'legend'},...kids.map(k=>E('span',{style:'--kc:'+kidColor(k.id)},E('i',{}),k.name))));
}
