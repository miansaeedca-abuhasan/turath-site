# Builds the Android app (APK) of «صلاۃ خیرالقرون» and puts it on the branch salah-apk (app.apk + build log).
name: build-salat-app
on:
  push:
    branches: [salah-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: cities (GeoNames, CC BY 4.0)
        run: |
          curl -fsSL --retry 3 -o /tmp/c.zip https://download.geonames.org/export/dump/cities1000.zip
          unzip -o -q /tmp/c.zip -d /tmp
          python3 tools/cities.py /tmp/cities1000.txt app/src/main/assets/cities.tsv
      - name: birdsong (BigSoundBank, CC0)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p app/src/main/res/raw
          if [ ! -f app/src/main/res/raw/birds1.mp3 ]; then
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o /tmp/b1.mp3 "https://bigsoundbank.com/UPLOAD/mp3/0999.mp3?v=d" && \
            ffmpeg -loglevel error -y -ss 5 -t 30 -i /tmp/b1.mp3 -af "afade=t=in:d=2,afade=t=out:st=26:d=4" -ac 1 -b:a 96k app/src/main/res/raw/birds1.mp3 || true
          fi
          ls -la app/src/main/res/raw
      - name: test and build
        run: |
          export VERSION_CODE=${{ github.run_number }}
          gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease 2>&1 | tee /tmp/build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          # two more copies of the release app, to find out what makes a phone refuse something: target API 35, and without shrinking
          mkdir -p /tmp/variants && cp app/build/outputs/apk/release/app-release.apk /tmp/variants/main.apk
          gradle --no-daemon assembleRelease -Pnomin=1 -x lint -x lintVitalRelease > /tmp/v2.log 2>&1 && cp app/build/outputs/apk/release/app-release.apk /tmp/variants/nomin.apk || true
          cp /tmp/variants/main.apk app/build/outputs/apk/release/app-release.apk
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: screenshots on an emulator
        timeout-minutes: 20
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene
          script: |
            python3 tools/smoke.py
      - name: publish to salah-apk
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/release/app-release.apk /tmp/out/salat-khairalquroon.apk 2>/dev/null || cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/salat-khairalquroon.apk 2>/dev/null || true
          cp /tmp/variants/nomin.apk /tmp/out/salat-test-unshrunk.apk 2>/dev/null || true
          cp app/build/outputs/bundle/release/app-release.aab /tmp/out/salat-khairalquroon.aab 2>/dev/null || true
          cp -r shots /tmp/out/ 2>/dev/null || true
          ls -la /tmp/camtest /tmp/variants > /tmp/out/variants.txt 2>&1 || true
          for n in 1 2 3 4; do tail -c 6000 /tmp/v$n.log > /tmp/out/v$n.log 2>/dev/null || true; done
          tail -c 60000 /tmp/build.log > /tmp/out/build-log.txt 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cat {} + > /tmp/out/tests.xml 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_number }}" > /tmp/out/VERSION.txt
          cd /tmp/out
          git init -q -b salah-apk
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A && git commit -qm "app build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" salah-apk
