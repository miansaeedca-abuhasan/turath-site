# Birdsong from Wikimedia Commons, and where each phrase of the adhans is (to cut alarm calls); commits the results
name: salat-assets
on:
  push:
    branches: [salah-app]
    paths: ['tools/assets_trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper
      - run: python3 tools/birds.py > tools/birds_log.txt 2>&1 || true
      - name: commit
        if: always()
        run: |
          git config user.name "assets-bot"; git config user.email "assets-bot@users.noreply.github.com"
          git add tools/birds_log.txt tools/birds_credits.json app/src/main/res/raw || true
          git commit -qm "birdsong and adhan phrase times" && git push
