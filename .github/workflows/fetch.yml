# Downloads the files listed in tools/fetch.txt into the branch salah-assets-raw (sound sources for the app, checked
# and cut before they go into the app).
name: fetch-assets
on:
  push:
    branches: [salah-app]
    paths: ['tools/fetch.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p /tmp/raw
          grep -v '^#' tools/fetch.txt | while IFS=$'\t' read -r url name; do
            [ -z "$url" ] && continue
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "/tmp/raw/$name" "$url" && echo "ok $name $(stat -c%s /tmp/raw/$name)" || echo "FAIL $name $url"
          done | tee /tmp/raw/_log.txt
      - name: commit to salah-assets-raw
        run: |
          cd /tmp/raw
          git init -q -b salah-assets-raw
          git config user.name "assets-bot"; git config user.email "assets-bot@users.noreply.github.com"
          git add -A && git commit -qm "raw assets $(date -u +%F-%T)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" salah-assets-raw
