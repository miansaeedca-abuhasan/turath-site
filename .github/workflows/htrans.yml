name: ai-translation-daily
on:
  schedule:
    - cron: '17 9 * * *'     # every day 09:17 UTC
  workflow_dispatch:
    inputs:
      n:
        description: 'New translations in this run'
        default: '200'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/htrans_cron.js
        env:
          HTRANS_CRON: ${{ secrets.HTRANS_CRON }}
          N: ${{ github.event.inputs.n || vars.HTRANS_AUTO || '200' }}
