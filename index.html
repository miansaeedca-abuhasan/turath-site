<script>
function ENGINE(){
// Browser-side engine: same /api/* answers as server.py, computed from window.TURATH_DATA.
// Lets the app run with no server and no Python (website, phone, installable PWA, offline).
(function () {
  const D = window.TURATH_DATA; if (!D) return;
  const STRIP = /[\u0610-\u061a\u064b-\u065f\u0670\u06d6-\u06ed\u0640]/g;
  const FOLD = {'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ى':'ی','ي':'ی','ې':'ی','ے':'ی','ئ':'ی','ك':'ک','ه':'ہ','ھ':'ہ','ة':'ہ','ۃ':'ہ','ۀ':'ہ','ؤ':'و','ں':'ن','ء':' '};
  const DIG = {}; '٠١٢٣٤٥٦٧٨٩'.split('').forEach((c, i) => DIG[c] = i); '۰۱۲۳۴۵۶۷۸۹'.split('').forEach((c, i) => DIG[c] = i);
  const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(STRIP, '').replace(/[٠-٩۰-۹]/g, c => DIG[c])
    .replace(/[أإآٱىيېےئكهھةۃۀؤںء]/g, c => FOLD[c]).toLowerCase().replace(/[\u02be\u02bf\u02bb\u02bc\u2019\u2018']/g, '').replace(/[^\p{L}\p{M}\p{N}\s]|_/gu, ' ').replace(/\s+/g, ' ').trim();
  const stem = t => { for (const p of ['وال', 'بال', 'لل', 'ال']) if (t.startsWith(p) && t.length - p.length >= 2) return t.slice(p.length); return t; };
  const toks = s => norm(s).split(' ').filter(Boolean).map(stem);
  const W = {matn: 3, translation: 2, chapter: 2, takhrij: 1.5, sanad: 1, sharh: 1, alfaz: 1, buhuth: 1, ext: 3, duroos: 1, extra: 0.7, intro: 0.7, intro_kitab: 0.5, intro_majmu: 0.5};
  const STOP = new Set(norm('کیا کیسے کی کے کا میں سے کو اور ہے ہیں یہ وہ ایک پر نے تو جو کہ لیے والی والا في من على عن إلى أن إن ما the of and to in a is was that he she it for with by on his her they from as at be this said').split(' '));

  const byNum = new Map(D.hadith.map(h => [h.num, h]));
  const extBy = new Map(D.external.map(e => [e.book + '|' + e.num, e]));
  const real = D.hadith.filter(h => !h.demo).sort((a, b) => a.num - b.num);
  const hasLayer = h => Object.keys(h.tuhfa).length > 0;
  const hasJami = h => h.demo || Object.keys(h.content).length > 0;
  const contentOf = (h, book) => book === 'tuhfa' ? h.tuhfa : h.content;
  const textsOf = (h, book) => {
    const a = [];
    if (h.sanad) a.push(['sanad', h.sanad]);
    h.matn.forEach(t => a.push(['matn', t]));
    (h.takhrij || '').split('\n').filter(Boolean).forEach(t => a.push(['takhrij', t]));
    if (h.chapter_ar) a.push(['chapter', h.chapter_ar]);
    if (h.chapter_ur) a.push(['chapter', h.chapter_ur]);
    if (h.chapter_en) a.push(['chapter', h.chapter_en]);
    if (h.takhrij_en) a.push(['takhrij', h.takhrij_en]);
    if (h.group_ar) a.push(['chapter', h.group_ar]);
    if (h.group_en) a.push(['chapter', h.group_en]);
    const c = contentOf(h, book);
    for (const k in c) for (const l in c[k]) c[k][l].forEach(t => a.push([k, t]));
    return a;
  };
  function buildIndex(items) {
    const idx = new Map();
    for (const [id, texts] of items) for (const [f, t] of texts) for (const k of toks(t)) {
      let m = idx.get(k); if (!m) idx.set(k, m = new Map());
      let o = m.get(id); if (!o) m.set(id, o = {});
      o[f] = (o[f] || 0) + 1;
    }
    return {idx, N: items.length};
  }
  // the same index built in small steps, so a phone is not frozen while it is made (the first search, or the first search after a language is loaded)
  async function buildIndexAsync(items) {
    const idx = new Map(); let c = 0;
    for (const [id, texts] of items) {
      for (const [f, t] of texts) for (const k of toks(t)) {
        let m = idx.get(k); if (!m) idx.set(k, m = new Map());
        let o = m.get(id); if (!o) m.set(id, o = {});
        o[f] = (o[f] || 0) + 1;
      }
      if (++c % 200 === 0) await new Promise(r => setTimeout(r, 0));
    }
    return {idx, N: items.length};
  }
  let jIdx = null, tIdx = null, jIdxP = null, tIdxP = null; const eIdx = {};
  const jamiIndex = () => jIdx || (jIdx = buildIndex(D.hadith.filter(hasJami).map(h => [h.num, textsOf(h, 'jami')])));
  const tuhfaIndex = () => tIdx || (tIdx = buildIndex(D.hadith.filter(hasLayer).map(h => [h.num, textsOf(h, 'tuhfa')])));
  const jamiReady = () => jIdx ? Promise.resolve() : (jIdxP || (jIdxP = buildIndexAsync(D.hadith.filter(hasJami).map(h => [h.num, textsOf(h, 'jami')])).then(i => { jIdx = i; })));
  const tuhfaReady = () => tIdx ? Promise.resolve() : (tIdxP || (tIdxP = buildIndexAsync(D.hadith.filter(hasLayer).map(h => [h.num, textsOf(h, 'tuhfa')])).then(i => { tIdx = i; })));
  const extIndex = b => eIdx[b] || (eIdx[b] = buildIndex(D.external.filter(e => e.book === b).map(e => [e.num, [['ext', e.matn]]])));

  function postings(I, t, exact) {
    const keys = (exact || t.length < 3) ? (I.idx.has(t) ? [t] : []) : [...I.idx.keys()].filter(k => k.startsWith(t));
    const out = new Map();
    for (const k of keys) {
      const m = I.idx.get(k), idf = Math.log(1 + I.N / m.size);
      for (const [id, o] of m) {
        let r = out.get(id); if (!r) out.set(id, r = {score: 0, fields: new Set()});
        for (const f in o) { r.score += (W[f] || 1) * (1 + Math.log(o[f])) * idf; r.fields.add(f); }
      }
    }
    return out;
  }
  function query(I, tk, op, scale, exact) {
    const lists = tk.map(t => postings(I, t, exact));
    const ids = op === 'and' ? [...lists[0].keys()].filter(id => lists.every(l => l.has(id)))
                             : [...new Set(lists.flatMap(l => [...l.keys()]))];
    return ids.map(id => {
      let s = 0; const f = new Set();
      for (const l of lists) { const r = l.get(id); if (r) { s += r.score; r.fields.forEach(x => f.add(x)); } }
      return {id, score: s * scale, fields: f};
    });
  }
  let EXACT = false;
  const flagsOf = (words, tk) => words.map(w => { const n = stem(norm(w).replace(/ /g, '')); return !!n && tk.some(t => n === t || (!EXACT && t.length >= 3 && n.startsWith(t))); });
  function snippet(text, tk, width = 20) {
    const words = text.split(/\s+/).filter(Boolean), fl = flagsOf(words, tk);
    let i = fl.indexOf(true); if (i < 0) i = 0;
    const a = Math.max(0, i - 5);
    return words.slice(a, a + width).map((w, j) => [w, fl[a + j]]);
  }
  function bestText(texts, tk) {
    let best = null, bs = 0;
    for (const [f, t] of texts) {
      const n = flagsOf(t.split(/\s+/).filter(Boolean), tk).filter(Boolean).length;
      const s = (W[f] || 1) * n * (f === 'chapter' ? 0.1 : 1);
      if (s > bs) { bs = s; best = t; }
    }
    return best;
  }
  const rowOf = (h, book, extra) => Object.assign({book, num: h.num, demo: !!h.demo, matn: h.matn[0].slice(0, 160),
    chapter: h.chapter_ur || h.chapter_ar, chapter_ar: h.chapter_ar, chapter_en: h.chapter_en, chapter_no: h.chapter_no || 0,
    fields: [], snippet: []}, extra);

  // mode: 'all' = every word present, any order (default) · 'exact' = the words together as one phrase · 'similar' = ranked, partial words too
  async function search(q, book, mode) {
    mode = mode || 'all'; EXACT = mode !== 'similar';
    const tk = toks(q.replace(/[&+،,]/g, ' ')); if (!tk.length) return [];
    const ext = book !== 'jami' && book !== 'tuhfa';
    const I = ext ? extIndex(book) : book === 'tuhfa' ? tuhfaIndex() : jamiIndex();
    const hits = new Map();
    const put = r => { const o = hits.get(r.id); if (!o || r.score > o.score) hits.set(r.id, {score: r.score, fields: new Set([...(o ? o.fields : []), ...r.fields])}); else r.fields.forEach(f => o.fields.add(f)); };
    if (tk.some(t => !t)) return [];
    query(I, tk, 'and', 1, mode !== 'similar').forEach(put);
    if (mode === 'similar' && hits.size < 5 && tk.length > 1) query(I, tk.filter(t => !STOP.has(t)).length ? tk.filter(t => !STOP.has(t)) : tk, 'or', 0.5).forEach(put);
    let ids = [...hits.keys()].sort((a, b) => hits.get(b).score - hits.get(a).score);
    if (mode === 'exact' && tk.length > 1) {            // keep only those where the words stand together, in this order
      const phrase = ' ' + tk.join(' ') + ' ';
      const keep = [];
      for (let i = 0; i < ids.length; i++) {
        const id = ids[i], texts = ext ? [['ext', extBy.get(book + '|' + id).matn]] : textsOf(byNum.get(id), book);
        if (texts.some(([, t]) => (' ' + toks(t).join(' ') + ' ').includes(phrase))) keep.push(id);
        if (i % 120 === 119) await new Promise(r => setTimeout(r, 0));
      }
      ids = keep;
    }
    if (mode !== 'similar') ids.sort((a, b) => a - b);  // in book order
    if (book === 'tuhfa') ids = ids.filter(id => hasLayer(byNum.get(id)));
    const total = ids.length;
    const rows = ids.slice(0, 300).map(id => {
      const f = [...hits.get(id).fields].sort();

const NRM=t=>(t||'').replace(/[-]|[^]*/g,'').replace(/ﷺ/g,'صلى الله عليه وسلم').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^ء-ي0-9\s]/g,' ');

    try{const it=await COLL.item(r.key,r.number,r.n);if(!it||!it.text)continue;

  best.raw.forEach((w,i)=>{const st=best.it.text.indexOf(w,pos);pos=st<0?pos:st+w.length;
    if(w.includes('['))inBr=true;const skip=inBr;if(w.includes(']'))inBr=false;if(skip){cur=null;return;}
    const x=sn.find(z=>st>=z.a&&st<z.b);const sp=el('span',{class:best.inn[i]?'':'dimw'},w);
    if(x){if(!cur||cur.x!==x){const a=el('a',{class:'snlink',href:x.href});
        a.addEventListener('click',e=>{const h=a.getAttribute('href')||'';if(/^#\/n\/\d+/.test(h)&&window.NAR&&NAR.openSheet){e.preventDefault();NAR.openSheet(+h.slice(4));}});
        cur={x,a};p.append(a);snNames.push(best.it.text.slice(x.a,x.b));snEls.push(a);}cur.a.append(sp,' ');}
    else{cur=null;p.append(sp,' ');}});
  box.append(el('p',{class:'jwnote',lang:ui,dir:DIR(ui)},FTX(3)),p,el('a',{href:best.it.href||'#'},T('open')));
  try{if(window.NAR&&NAR.linkChips&&snEls.length){const nn=best.r.n||await COLL.toN(best.r.key,best.r.number)||+best.r.number;if(nn)NAR.linkChips(best.r.key,nn,snNames,snEls);}}catch(e){}
}

      if (token !== RUN) return false;

        if (token !== RUN) return false;
        if (!voicesFor(it.lang).length && !LISTEN.warned[it.lang]) { LISTEN.warned[it.lang] = 1; toast(T('noVoice')(it.lang)); }

  // the visitor count (one count per device per day; only a total is kept — see functions/api/visits.js)
  async function visitCount(box) {
    const VL = {ur: 'زائرین', ar: 'الزوار', en: 'Visitors', fr: 'Visiteurs', hi: 'आगंतुक', bn: 'দর্শনার্থী', gu: 'મુલાકાતીઓ'};
    try {
      const d = new Date().toISOString().slice(0, 10); let k = null; try { k = localStorage.vday; } catch (e) {}
      const post = k !== d, r = await fetch('api/visits', {method: post ? 'POST' : 'GET', cache: 'no-store'});
      if (!r.ok) return; const j = await r.json();
      if (post) try { localStorage.vday = d; } catch (e) {}
      if (j.n) {
        const nf = x => Number(x).toLocaleString(ui === 'ar' ? 'ar' : 'en-US');
        box.replaceChildren(' · ', (VL[ui] || VL.en) + ': ' + nf(j.n));
        const cs = Object.entries(j.c || {});
        if (cs.length) {
          const OL = {ur: 'پرانے زائرین (ملک معلوم نہیں)', ar: 'زوار سابقون (البلد غير معروف)', en: 'Earlier visitors (country unknown)', fr: 'Visiteurs précédents (pays inconnu)', hi: 'पहले के आगंतुक (देश अज्ञात)', bn: 'আগের দর্শনার্থী (দেশ অজানা)', gu: 'અગાઉના મુલાકાતીઓ (દેશ અજાણ્યો)'};
          const UL2 = {ur: 'نامعلوم ملک', ar: 'بلد غير معروف', en: 'Unknown country', fr: 'Pays inconnu', hi: 'अज्ञात देश', bn: 'অজানা দেশ', gu: 'અજાણ્યો દેશ'};
          let dn = null; try { dn = new Intl.DisplayNames([ui], {type: 'region'}); } catch (e) {}
          const SH = {ur: {AE: 'عرب امارات', US: 'امریکہ', GB: 'برطانیہ'}, en: {AE: 'UAE', US: 'USA', GB: 'UK'}, ar: {AE: 'الإمارات', US: 'أمريكا', GB: 'بريطانيا'}};
          const nm = cc => { if (cc === 'XX') return UL2[ui] || UL2.en; if (SH[ui] && SH[ui][cc]) return SH[ui][cc]; try { return (dn && dn.of(cc)) || cc; } catch (e) { return cc; } };
          const known = cs.reduce((a, x) => a + x[1], 0), older = j.n - known;
          const rows = cs.map(([cc, n]) => [nm(cc), n]); if (older > 0) rows.push([OL[ui] || OL.en, older]);
          const list = el('div', {class: 'vcountries', hidden: true}, ...rows.map((r, i) => el('div', {class: (older > 0 && i === rows.length - 1) ? 'vold' : ''}, r[0] + ': ' + nf(r[1]))));
          const btn = el('button', {type: 'button', class: 'vbtn', 'aria-label': VL[ui] || VL.en, on: {click: () => { list.hidden = !list.hidden; }}}, ' ▾');
          box.append(btn); if (box.parentNode) box.parentNode.after(list);
        }
      }
    } catch (e) {}

  /* ---------- find ayah, search, bookmarks ---------- */
  async function findAyah() {
    await need([]);
    const sel = el('select', {'aria-label': T('surahs')}), num = el('input', {type: 'number', min: '1', value: '1', 'aria-label': T('ayahNo'), inputmode: 'numeric'});
    Q.meta.surahs.forEach((m, i) => sel.append(el('option', {value: i + 1}, (i + 1) + '. ' + (LTR() ? m[0] : m[1]))));
    const sync = () => { num.max = Q.meta.surahs[sel.value - 1][4]; }; sel.addEventListener('change', sync); sync();
    sheet(T('findAyah'), [el('label', {class: 'srow'}, el('span', {}, T('surahs')), sel), el('label', {class: 'srow'}, el('span', {}, T('ayahNo')), num)],
      [[T('close'), null], [T('go'), () => { const a = Math.max(1, Math.min(+num.max, +num.value || 1)); location.hash = '#/q/s/' + sel.value + '/' + a; }]]);
  }
  // search form of a word: no harakat or Quranic marks, no alif (so اَلۡقُرۡاٰن = القرآن, الصّٰلِحٰت = الصالحات), unified letters
  const qnorm = s => (s || '').normalize('NFKD').replace(/[ؐ-ًؚ-ٰٟۖ-ۭ࣓-ࣿـ‌-‏]/g, '')
    .replace(/[أإآٱا]/g, '').replace(/[ؤ]/g, 'و').replace(/[ئىیيې]/g, 'ي').replace(/[ةۃ]/g, 'ه').replace(/ک/g, 'ك').replace(/ء/g, '')
    .replace(/[^\p{L}\p{N}\s\u0980-\u09ff]/gu, ' ').toLowerCase().replace(/\s+/g, ' ').trim();
  // split a verse into words with their search forms
  const wordsOf = t => t.split(/(\s+)/).map(w => ({w, n: /\S/.test(w) ? qnorm(w) : null}));
  // indexes of the words that make up the searched phrase (whole words only)
  function hitWords(words, qw) {
    const real = words.map((x, i) => [x, i]).filter(([x]) => x.n !== null && x.n !== '');
    const hits = new Set();
    for (let s = 0; s + qw.length <= real.length; s++) {
      let ok = true;
      for (let j = 0; j < qw.length && ok; j++) {
        const n = real[s + j][0].n;
        ok = n === qw[j];                    // exactly the typed words, in this order — no longer or similar words
      }
      if (ok) for (let j = 0; j < qw.length; j++) hits.add(real[s + j][1]);
    }
    return hits;
  }
  function marked(text, qw) {
    const words = wordsOf(text), hits = hitWords(words, qw);
    return words.map((x, i) => hits.has(i) ? el('mark', {class: 'qhit'}, x.w) : x.w);
  }
  async function showSearch(q0) {
    bar(T('qsearch'), T('quran'), true);
    const v = qv(); v.replaceChildren();
    const inp = el('input', {type: 'search', class: 'filter', placeholder: T('qsearchPh'), 'aria-label': T('qsearch'), value: q0 || '', id: 'qsin'});
    let mode = lsGet('qsmode', 'aya');
    const seg = el('div', {class: 'seg', role: 'group'});
    const head = el('div', {class: 'qshead'});
    const out = el('ol', {class: 'qres'});
    let last = [];
    const drawSeg = () => seg.replaceChildren(...[['aya', T('onlyAya')], ['tr', T('ayaTr')]].map(([k, l]) =>
      el('button', {type: 'button', class: 'segb', 'aria-pressed': String(k === mode), on: {click: () => { mode = k; lsSet('qsmode', k); drawSeg(); run(); }}}, l)));
    drawSeg();
    v.append(el('div', {class: 'card pad0 filterbox'}, icon('search'), inp), seg, head, out);
    const refOf = (s, a) => '[' + Q.meta.surahs[s - 1][1] + ' ' + ad(a) + ']';
    const textOf = (s, a) => verse(AK(), s, a) + ' ' + refOf(s, a) + (mode === 'tr' ? '\n' + QS.tr.map(k => verse(k, s, a)).filter(Boolean).join('\n') : '');
    let tm;
    async function run() {
      const raw = inp.value.trim(), q = qnorm(raw);
      if (q.replace(/\s/g, '').length < 2) { out.replaceChildren(); head.replaceChildren(); return; }
      const qw = q.split(' ');
      const script = /[\u0980-\u09ff]/.test(raw) ? 'bn' : /[\u0600-\u06ff]/.test(raw) ? 'ur' : 'en';          // Arabic letters: the Quran text and the Urdu translations
      const arabicQ = script === 'ur' && !/[\u0679\u0688\u0691\u06ba\u06d2\u06d3\u06c1\u06be\u06af\u0686\u067e\u0698]/.test(raw);
      let trKeys = QS.tr.filter(k => k.startsWith(script));
      if (!trKeys.length) trKeys = [script === 'en' ? 'en_sahih' : script === 'bn' ? 'bn_zakaria' : 'ur_junagarhi'];
      const keys = (arabicQ ? [AK()] : []).concat(trKeys);
      const showKeys = mode === 'tr' ? QS.tr.slice() : [];
      head.replaceChildren(el('p', {class: 'note'}, T('loading')));
      await need(arKeys().concat(QS.tr, trKeys));
      if (!Q.norm) Q.norm = {};
      const found = new Map();      // verse index → editions it was found in
      for (const k of keys) {
        if (!Q.norm[k]) Q.norm[k] = Q.data[k].map(qnorm);
        Q.norm[k].forEach((t, i) => { if ((' ' + t + ' ').includes(' ' + q + ' ')) { if (!found.has(i)) found.set(i, new Set()); found.get(i).add(k); } });
      }
      // keep only verses where the phrase really matches whole words
      last = [...found.entries()].sort((a, b) => a[0] - b[0]).filter(([i, ks]) => [...ks].some(k => hitWords(wordsOf(Q.data[k][i]), qw).size));
      head.replaceChildren(el('div', {class: 'qsbar'}, el('span', {class: 'cs'}, T('results') + ': ' + (NUM(last.length))),
        last.length ? el('button', {class: 'btn lbtn', type: 'button', on: {click: async () => toast(T(await copyText(withLink(last.map(([i]) => { const [s, a] = sa(i); return textOf(s, a); }).join('\n\n'))) ? 'copied' : 'copyfail'))}}, icon('copy'), T('copyAll')) : null));
      out.replaceChildren();
      const LIMIT = 300;
      last.slice(0, LIMIT).forEach(([i, ks], n) => {
        const [s, a] = sa(i);
        const li = el('li', {class: 'qr'});
        const top = el('div', {class: 'qrtop'},
          el('span', {class: 'qrno'}, (NUM(n + 1)) + '.'),
          el('p', {class: 'qar qra', lang: 'ar'}, ...(ks.has(AK()) ? marked(verse(AK(), s, a), qw) : [verse(AK(), s, a)])),
          el('div', {class: 'qrside'}, el('a', {class: 'qref', href: '#/q/s/' + s + '/' + a, lang: 'ar'}, refOf(s, a)),
            el('button', {class: 'ab', type: 'button', title: T('copyRange'), 'aria-label': T('copyRange'), on: {click: () => copySheet({s, from: a, to: a})}}, icon('copy'))));
        li.append(top);
        const shown = [...new Set(showKeys.concat([...ks].filter(k => k !== AK())))];
        const eds = shown.map(k => Q.meta.editions.find(e => e.key === k)).filter(Boolean);
        eds.forEach(e => { const t = verse(e.key, s, a); if (!t) return;
          li.append(el('p', {class: 'qtr ' + (e.lang === 'ar' ? 'ur' : e.lang), lang: e.lang, dir: e.lang === 'ur' || e.lang === 'ar' ? 'rtl' : 'ltr'}, ...(ks.has(e.key) ? marked(t, qw) : [t]), eds.length > 1 ? el('small', {class: 'trname inl'}, ' — ' + edLabel(e)) : null)); });
        out.append(li);
      });
      if (last.length > LIMIT) out.append(el('p', {class: 'note'}, T('moreRes')(last.length - LIMIT)));
    }
    inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(run, 300); });
    inp.focus(); if (q0) run();
  }

  async function showQbm() {

        el('span', {class: 'qar sm', lang: 'ar'}, verse(AK(), s, a)), trText(trk, s, a))));
  }

      if (h === '#/q/bm') return showQbm();
      return showQHome();
    },
    leave() { hideBar(); if (window.QIBLA) QIBLA.stop(); stopAuto(); if (AU.on) { stopAudio(); PLAYER.hide(); } R = null; },
    stopAudio() { stopAudio(); },

      cmpOpen: 'ખોલો', cmpCount: n => n + ' હદીસો'},
    fr: {cmp: 'Comparer', cmpTitle: 'Comparer des hadiths', cmpRefs: 'Comparer avec ses sources', cmpAdd: 'Ajouter à la comparaison', cmpAdded: 'Ajouté à la liste de comparaison',
      cmpRemoved: 'Retiré de la liste de comparaison', cmpMain: 'Hadith principal', cmpMakeMain: 'Définir comme principal', cmpRemove: 'Retirer', cmpClear: 'Vider la liste',
      cmpEmpty: 'La liste de comparaison est vide. Touchez ⇄ sur un hadith pour l’ajouter ici, ou « Comparer avec ses sources » sur un hadith d’Al-Jami al-Kamil.',
      cmpSame: p => p + ' % de similitude', cmpLegend: 'Vert : mots ajoutés par rapport au hadith principal — rouge barré : mots absents de cette version — estompé : chaîne de transmission ou remarques de l’auteur',
      cmpNone: 'Aucun des livres cités dans les références de ce hadith n’est dans l’application.', cmpExt: 'Ce livre se trouve dans l’autre lien de l’application', cmpMy: 'Ma liste de comparaison',
      cmpOpen: 'Ouvrir', cmpCount: n => n + (n > 1 ? ' hadiths' : ' hadith')}};
  Object.keys(CMPX).forEach(l => { I[l] = I[l] || {}; Object.assign(I[l], CMPX[l]); });
  ICON.compare = 'M9 3L5 7l4 4V8h7V6H9V3zm6 10v3H8v2h7v3l4-4-4-4z';

  const N = n => NUM(n);
  const TASH = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
  const nw = w => w.replace(TASH, '').replace(/[\u064b-\u065f\u0670\u06d6-\u06ed\u08d3-\u08ff\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/[ىی]/g, 'ي').replace(/ک/g, 'ك').replace(/[^ء-ي]/g, '');
  const SAW = /\(?\s*(?:ﷺ|صلى الله عليه وسلم|صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ|صلى الله عليه وآله وسلم|صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ)\s*\)?/g;
  // punctuation, brackets and all harakat are left out of the comparison: (( )) . ۔ ، ! ؟ , ' ” “ « » [ ] { } ﴿ ﴾ …, َ ُ ِ ً ٌ ٍ ْ ّ ٰ ٗ ٖ ٕ ٓ …
  // a token that is only punctuation is dropped; punctuation stuck to a word is ignored in its comparison form
  const words = t => (t || '').replace(SAW, ' ﷺ ').replace(/[()\[\]{}﴿﴾«»“”"‘’'.,،؛;:!?؟۔…]+/g, m => ' ' + m + ' ').split(/\s+/).filter(Boolean)
    .map(w => ({w, n: w === 'ﷺ' ? 'ﷺ' : nw(w)})).filter(x => x.n);

  // the shared stretch of the other text: from its first to its last 3-word run that also occurs in the main text
  function window3(main, other) {
    const g = new Set(); for (let i = 0; i + 2 < main.length; i++) g.add(main[i].n + ' ' + main[i + 1].n + ' ' + main[i + 2].n);
    const pos = []; for (let i = 0; i + 2 < other.length; i++) if (g.has(other[i].n + ' ' + other[i + 1].n + ' ' + other[i + 2].n)) pos.push(i);
    if (!pos.length) return [0, other.length];
    // the densest stretch about as long as the main hadith (so a later remark that repeats a phrase is left out)
    const W = Math.max(12, Math.round(main.length * 1.4));
    let best = 0, bi = 0;
    for (let i = 0, j = 0; i < pos.length; i++) { while (j < pos.length && pos[j] - pos[i] <= W) j++; if (j - i > best) { best = j - i; bi = i; } }
    const last = pos.filter(p => p >= pos[bi] && p - pos[bi] <= W).pop();
    return [pos[bi], Math.min(other.length, last + 3)];
  }
  function lcsOps(A, B) {             // word-level diff of A (main) and B (other): [['=',w],['+',w],['-',w]]
    const m = A.length, n = B.length, L = Array.from({length: m + 1}, () => new Uint16Array(n + 1));
    for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i].n && A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < m && j < n) {
      if (A[i].n && A[i].n === B[j].n) { ops.push(['=', B[j].w]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { ops.push(['-', A[i].w]); i++; }
      else { ops.push(['+', B[j].w]); j++; }
    }
    while (i < m) ops.push(['-', A[i++].w]);
    while (j < n) ops.push(['+', B[j++].w]);
    return {ops, same: L[0][0]};
  }
  function diffNode(mainText, otherText) {
    const A = words(mainText).slice(0, 700), Ball = words(otherText).slice(0, 1400);
    const [a, z] = window3(A, Ball), B = Ball.slice(a, z), {ops, same} = lcsOps(A, B);
    const p = el('p', {class: 'cmptext', lang: 'ar', dir: 'rtl'});
    if (a > 0) p.append(el('span', {class: 'cmpfade'}, Ball.slice(0, a).map(x => x.w).join(' ') + ' '));
    ops.forEach(([o, w]) => p.append(o === '=' ? w : el(o === '+' ? 'ins' : 'del', {}, w), ' '));
    if (z < Ball.length) p.append(el('span', {class: 'cmpfade'}, Ball.slice(z).map(x => x.w).join(' ')));
    const pct = A.filter(x => x.n).length ? Math.round(100 * same / A.filter(x => x.n).length) : 0;
    return {node: p, pct};
  }

  // ---- basket (my compare list) ----
  const load = () => { try { const a = JSON.parse(localStorage.cmp || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const save = a => { try { localStorage.cmp = JSON.stringify(a.slice(0, 30)); } catch (e) {} };
  const same = (x, y) => x.k === y.k && String(x.n) === String(y.n);
  function toggle(item) {
    const a = load(), i = a.findIndex(x => same(x, item));
    if (i >= 0) { a.splice(i, 1); toast(T('cmpRemoved')); } else { a.push(item); toast(T('cmpAdded')); }
    save(a); return i < 0;
  }
  function button(item) {     // ⇄ button for a hadith card
    const b = el('button', {class: 'ab cmpb', type: 'button', title: T('cmpAdd'), 'aria-label': T('cmpAdd')}, icon('compare'));
    const paint = () => b.classList.toggle('on', load().some(x => same(x, item)));
    b.addEventListener('click', () => { toggle(item); paint(); }); paint();
    return b;
  }

  // ---- text of one hadith: {title, text, grade, href, ext} ----
  async function getItem(it) {
    if (it.k === 'jami') {
      const d = await api('hadith/' + it.n + '?book=jami');
      if (d.error) return null;
      return {title: T('jamiName') + ' ' + N(d.num), text: (d.matn || []).join(' '), sanad: d.sanad, grade: d.grade, href: '#/h/' + d.num, refs: d.refs || []};
    }
    return COLL.item(it.k, it.p, it.n);
  }

  function itemCard(x, extra) {
    const c = el('article', {class: 'card cmpcard'});
    c.append(el('div', {class: 'top'}, el('b', {class: 'cmph'}, x.title), extra || '', el('span', {class: 'sp'}),
      x.href ? el('a', {class: 'btn', href: x.href}, T('cmpOpen')) : ''));
    if (x.grade) c.append(el('p', {class: 'cs agrade', lang: 'ar'}, x.grade));
    return c;
  }

  async function render(main, others, box, controls) {
    const m = itemCard(main, el('span', {class: 'tag cmptag'}, T('cmpMain')));
    if (main.sanad) m.append(el('p', {class: 'cmptext cmpfade', lang: 'ar'}, main.sanad));
    m.append(el('p', {class: 'cmptext', lang: 'ar', dir: 'rtl'}, main.text));
    if (controls) m.append(controls(main));
    box.append(m, el('p', {class: 'note cmplegend'}, T('cmpLegend')));
    for (const o of others) {
      if (!o) continue;
      if (o.ext) { box.append(el('div', {class: 'card'}, el('b', {}, o.title), el('p', {class: 'note'}, T('cmpExt')), el('a', {class: 'btn lbtn', href: o.ext, target: '_blank', rel: 'noopener'}, T('cOpenExt')))); continue; }
      const {node, pct} = diffNode(main.text, o.text);
      const c = itemCard(o, el('span', {class: 'tag cmppct' + (pct >= 80 ? ' hi' : pct >= 50 ? ' mid' : ' lo')}, T('cmpSame')(N(pct))));
      c.append(node);
      if (controls) c.append(controls(o));
      box.append(c);
    }
  }

  async function showRefs(num) {
    bar(T('cmpRefs'), T('jamiName') + ' ' + N(num), true);
    const box = $('#list'); box.replaceChildren(el('p', {class: 'note'}, T('loading')));
    const main = await getItem({k: 'jami', n: num});
    if (!main) { box.replaceChildren(el('p', {class: 'note'}, T('nf'))); return; }
    const seen = new Set(), refs = main.refs.filter(r => COLL.has(r.key) && !seen.has(r.key + '|' + (r.n || r.number)) && seen.add(r.key + '|' + (r.n || r.number)));
    const others = await Promise.all(refs.map(r => COLL.item(r.key, r.number, r.n).catch(() => null)));
    box.replaceChildren();
    if (!others.some(Boolean)) { box.append(el('p', {class: 'note'}, T('cmpNone'))); }
    await render(main, others, box);
  }

  async function showList() {
    bar(T('cmpTitle'), T('cmpMy'), true);
    const box = $('#list'); box.replaceChildren();
    let a = load();
    if (!a.length) { box.append(el('p', {class: 'note'}, T('cmpEmpty'))); return; }
    box.append(el('p', {class: 'note'}, T('loading')));
    const items = await Promise.all(a.map(x => getItem(x).then(v => v && Object.assign(v, {_it: x})).catch(() => null)));
    box.replaceChildren(el('div', {class: 'gsbar'}, el('button', {class: 'chip', type: 'button', on: {click: () => { save([]); showList(); }}}, T('cmpClear'))));
    const ok = items.filter(Boolean); if (!ok.length) { box.append(el('p', {class: 'note'}, T('cmpEmpty'))); return; }
    const controls = x => el('div', {class: 'acts'},
      x === ok[0] ? '' : el('button', {class: 'chip', type: 'button', on: {click: () => { save([x._it].concat(load().filter(y => !same(y, x._it)))); showList(); }}}, T('cmpMakeMain')),
      el('button', {class: 'chip', type: 'button', on: {click: () => { save(load().filter(y => !same(y, x._it))); showList(); }}}, T('cmpRemove')));
    await render(ok[0], ok.slice(1), box, controls);
  }

  window.CMP = {
    button, toggle, count: () => load().length,
    route(h) { const m = h.match(/^#\/cmp\/j\/(\d+)/); return m ? showRefs(+m[1]) : showList(); }};
})();

(function () {
  const KEY = 'harakatOff', RE = /[ً-ٰٟۖ-ۭ]/g, HAS = /[ً-ٰٟ]/;

  let off = false; try { off = localStorage.getItem(KEY) === '1'; } catch (e) {}
  const orig = new Map(); let btn, pend = false;
  const skip = n => { const p = n.parentElement; return !p || p.closest('.qar,.qv,.ayah,script,style,input,textarea,.harakat-btn,[data-keeph]'); };
  function strip(root) {
    root.querySelectorAll('.ar,[lang=ar]').forEach(r => {
      if (r.closest('.qar,.qv,.ayah,[data-keeph]')) return;
      const w = document.createTreeWalker(r, NodeFilter.SHOW_TEXT);
      for (let n = w.nextNode(); n; n = w.nextNode()) {
        if (orig.has(n) || !HAS.test(n.nodeValue) || skip(n)) continue;

  }
