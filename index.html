<script>
function ENGINE(){
// Browser-side engine: same /api/* answers as server.py, computed from window.TURATH_DATA.
// Lets the app run with no server and no Python (website, phone, installable PWA, offline).
(function () {
  const D = window.TURATH_DATA; if (!D) return;
  const STRIP = /[\u0610-\u061a\u064b-\u065f\u0670\u06d6-\u06ed\u0640]/g;
  const FOLD = {'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ى':'ی','ي':'ی','ې':'ی','ے':'ی','ئ':'ی','ك':'ک','ه':'ہ','ھ':'ہ','ة':'ہ','ۃ':'ہ','ۀ':'ہ','ؤ':'و','ں':'ن','ء':' '};
  const DIG = {}; '٠١٢٣٤٥٦٧٨٩'.split('').forEach((c, i) => DIG[c] = i); '۰۱۲۳۴۵۶۷۸۹'.split('').forEach((c, i) => DIG[c] = i);
  const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(STRIP, '').replace(/[٠-٩۰-۹]/g, c => DIG[c])
    .replace(/[أإآٱىيېےئكهھةۃۀؤںء]/g, c => FOLD[c]).toLowerCase().replace(/[\u02be\u02bf\u02bb\u02bc\u2019\u2018']/g, '').replace(/[^\p{L}\p{M}\p{N}\s]|_/gu, ' ').replace(/\s+/g, ' ').trim();
  const stem = t => { for (const p of ['وال', 'بال', 'لل', 'ال']) if (t.startsWith(p) && t.length - p.length >= 2) return t.slice(p.length); return t; };
  const toks = s => norm(s).split(' ').filter(Boolean).map(stem);
  const W = {matn: 3, translation: 2, chapter: 2, takhrij: 1.5, sanad: 1, sharh: 1, alfaz: 1, buhuth: 1, ext: 3, duroos: 1, extra: 0.7, intro: 0.7, intro_kitab: 0.5, intro_majmu: 0.5};
  const STOP = new Set(norm('کیا کیسے کی کے کا میں سے کو اور ہے ہیں یہ وہ ایک پر نے تو جو کہ لیے والی والا في من على عن إلى أن إن ما the of and to in a is was that he she it for with by on his her they from as at be this said').split(' '));

  const byNum = new Map(D.hadith.map(h => [h.num, h]));
  const extBy = new Map(D.external.map(e => [e.book + '|' + e.num, e]));
  const real = D.hadith.filter(h => !h.demo).sort((a, b) => a.num - b.num);
  const hasLayer = h => Object.keys(h.tuhfa).length > 0;
  const hasJami = h => h.demo || Object.keys(h.content).length > 0;
  const contentOf = (h, book) => book === 'tuhfa' ? h.tuhfa : h.content;
  const textsOf = (h, book) => {
    const a = [];
    if (h.sanad) a.push(['sanad', h.sanad]);
    h.matn.forEach(t => a.push(['matn', t]));
    (h.takhrij || '').split('\n').filter(Boolean).forEach(t => a.push(['takhrij', t]));
    if (h.chapter_ar) a.push(['chapter', h.chapter_ar]);
    if (h.chapter_ur) a.push(['chapter', h.chapter_ur]);
    if (h.chapter_en) a.push(['chapter', h.chapter_en]);
    if (h.takhrij_en) a.push(['takhrij', h.takhrij_en]);
    if (h.group_ar) a.push(['chapter', h.group_ar]);
    if (h.group_en) a.push(['chapter', h.group_en]);
    const c = contentOf(h, book);
    for (const k in c) for (const l in c[k]) c[k][l].forEach(t => a.push([k, t]));
    return a;
  };
  function buildIndex(items) {
    const idx = new Map();
    for (const [id, texts] of items) for (const [f, t] of texts) for (const k of toks(t)) {
      let m = idx.get(k); if (!m) idx.set(k, m = new Map());
      let o = m.get(id); if (!o) m.set(id, o = {});
      o[f] = (o[f] || 0) + 1;
    }
    return {idx, N: items.length};
  }
  let jIdx = null, tIdx = null; const eIdx = {};
  const jamiIndex = () => jIdx || (jIdx = buildIndex(D.hadith.filter(hasJami).map(h => [h.num, textsOf(h, 'jami')])));
  const tuhfaIndex = () => tIdx || (tIdx = buildIndex(D.hadith.filter(hasLayer).map(h => [h.num, textsOf(h, 'tuhfa')])));
  const extIndex = b => eIdx[b] || (eIdx[b] = buildIndex(D.external.filter(e => e.book === b).map(e => [e.num, [['ext', e.matn]]])));

  function postings(I, t, exact) {
    const keys = (exact || t.length < 3) ? (I.idx.has(t) ? [t] : []) : [...I.idx.keys()].filter(k => k.startsWith(t));
    const out = new Map();
    for (const k of keys) {
      const m = I.idx.get(k), idf = Math.log(1 + I.N / m.size);
      for (const [id, o] of m) {
        let r = out.get(id); if (!r) out.set(id, r = {score: 0, fields: new Set()});
        for (const f in o) { r.score += (W[f] || 1) * (1 + Math.log(o[f])) * idf; r.fields.add(f); }
      }
    }
    return out;
  }
  function query(I, tk, op, scale, exact) {
    const lists = tk.map(t => postings(I, t, exact));
    const ids = op === 'and' ? [...lists[0].keys()].filter(id => lists.every(l => l.has(id)))
                             : [...new Set(lists.flatMap(l => [...l.keys()]))];
    return ids.map(id => {
      let s = 0; const f = new Set();
      for (const l of lists) { const r = l.get(id); if (r) { s += r.score; r.fields.forEach(x => f.add(x)); } }
      return {id, score: s * scale, fields: f};
    });
  }
  let EXACT = false;
  const flagsOf = (words, tk) => words.map(w => { const n = stem(norm(w).replace(/ /g, '')); return !!n && tk.some(t => n === t || (!EXACT && t.length >= 3 && n.startsWith(t))); });
  function snippet(text, tk, width = 20) {
    const words = text.split(/\s+/).filter(Boolean), fl = flagsOf(words, tk);
    let i = fl.indexOf(true); if (i < 0) i = 0;
    const a = Math.max(0, i - 5);
    return words.slice(a, a + width).map((w, j) => [w, fl[a + j]]);
  }
  function bestText(texts, tk) {
    let best = null, bs = 0;
    for (const [f, t] of texts) {
      const n = flagsOf(t.split(/\s+/).filter(Boolean), tk).filter(Boolean).length;
      const s = (W[f] || 1) * n * (f === 'chapter' ? 0.1 : 1);
      if (s > bs) { bs = s; best = t; }
    }
    return best;
  }
  const rowOf = (h, book, extra) => Object.assign({book, num: h.num, demo: !!h.demo, matn: h.matn[0].slice(0, 160),
    chapter: h.chapter_ur || h.chapter_ar, chapter_ar: h.chapter_ar, chapter_en: h.chapter_en, chapter_no: h.chapter_no || 0,
    fields: [], snippet: []}, extra);

  // mode: 'all' = every word present, any order (default) · 'exact' = the words together as one phrase · 'similar' = ranked, partial words too
  function search(q, book, mode) {
    mode = mode || 'all'; EXACT = mode !== 'similar';
    const tk = toks(q.replace(/[&+،,]/g, ' ')); if (!tk.length) return [];
    const ext = book !== 'jami' && book !== 'tuhfa';
    const I = ext ? extIndex(book) : book === 'tuhfa' ? tuhfaIndex() : jamiIndex();
    const hits = new Map();
    const put = r => { const o = hits.get(r.id); if (!o || r.score > o.score) hits.set(r.id, {score: r.score, fields: new Set([...(o ? o.fields : []), ...r.fields])}); else r.fields.forEach(f => o.fields.add(f)); };
    if (tk.some(t => !t)) return [];
    query(I, tk, 'and', 1, mode !== 'similar').forEach(put);
    if (mode === 'similar' && hits.size < 5 && tk.length > 1) query(I, tk.filter(t => !STOP.has(t)).length ? tk.filter(t => !STOP.has(t)) : tk, 'or', 0.5).forEach(put);
    let ids = [...hits.keys()].sort((a, b) => hits.get(b).score - hits.get(a).score);
    if (mode === 'exact' && tk.length > 1) {            // keep only those where the words stand together, in this order
      const phrase = ' ' + tk.join(' ') + ' ';
      ids = ids.filter(id => { const texts = ext ? [['ext', extBy.get(book + '|' + id).matn]] : textsOf(byNum.get(id), book);
        return texts.some(([, t]) => (' ' + toks(t).join(' ') + ' ').includes(phrase)); });
    }
    if (mode !== 'similar') ids.sort((a, b) => a - b);  // in book order
    if (book === 'tuhfa') ids = ids.filter(id => hasLayer(byNum.get(id)));
    search.total = ids.length;
    return ids.slice(0, 300).map(id => {
      const f = [...hits.get(id).fields].sort();
      if (ext) { const e = extBy.get(book + '|' + id); return {book, num: id, demo: false, matn: e.matn.slice(0, 160), chapter: '', fields: [], snippet: snippet(e.matn, tk)}; }
      const h = byNum.get(id), t = bestText(textsOf(h, book), tk);
      return rowOf(h, book, {fields: f, snippet: t ? snippet(t, tk) : []});
    });
  }
  function hadithObj(h, book) {
    const prev = real.filter(x => x.num < h.num).pop(), next = real.find(x => x.num > h.num);
    return Object.assign({}, h, {content: contentOf(h, book), tuhfa: undefined, has_tuhfa: hasLayer(h), has_jami: hasJami(h),
      refs: h.refs.map(r => ({key: r.key, label: r.label, number: r.number, n: r.n, available: extBy.has(r.key + '|' + r.number)})),
      prev: prev ? prev.num : null, next: next ? next.num : null});
  }
  function resolveBook(name) {
    const n = norm(name), last = stem(n.split(' ').pop());
    if (D.bookmap[n] || D.bookmap[stem(n)] || D.bookmap[last]) return D.bookmap[n] || D.bookmap[stem(n)] || D.bookmap[last];
    const b = D.books.find(b => norm(b.name) === n || b.key === name.trim()); return b ? b.key : null;
  }
  // each translation language opens as its own book (jami_bn …) over the same Arabic text
  const LANGN = {bn: ['الجامع الکامل — বাংলা', 'Al-Jame Al-Kamil — বাংলা'], hi: ['الجامع الکامل — हिन्दी', 'Al-Jame Al-Kamil — हिन्दी'], ur: ['الجامع الکامل — اردو', 'Al-Jame Al-Kamil — Urdu']};
  const VIRT = (D.langs || []).map(l => ({key: 'jami_' + l, name: (LANGN[l] || [l])[0], name_en: (LANGN[l] || [l, l])[1], kind: 'lang', lang: l}));
  const inLang = (h, tl) => !tl ? h : Object.assign({}, h, {part_en: h['part_' + tl] || h.part_en, group_en: h['group_' + tl] || h.group_en,
    chapter_en: h['chapter_' + tl] || h.chapter_en, takhrij_en: h['takhrij_' + tl] || '', tl});
  const realApi = async function (u, tl) {
    const [path, qs] = u.split('?'), q = Object.fromEntries(new URLSearchParams(qs || ''));
    if (path === 'books') return {books: D.books.slice(0, 1).concat(VIRT, D.books.slice(1))};
    if (path === 'toc') {
      const kit = new Map();
      D.hadith.filter(h => !h.demo && hasJami(h)).map(h => inLang(h, tl)).forEach(h => {
        const kk = h.part_no + '|' + h.part_en; let k = kit.get(kk);
        if (!k) kit.set(kk, k = {no: h.part_no, en: h.part_en, ar: h.part_ar, count: 0, ch: new Map()});
        k.count++;
        const ck = h.chapter_no + '|' + h.chapter_en + '|' + h.group_en; let c = k.ch.get(ck);
        if (!c) k.ch.set(ck, c = {no: h.chapter_no, en: h.chapter_en, ar: h.chapter_ar, group_no: h.group_no, group_en: h.group_en, group_ar: h.group_ar, nums: []});
        c.nums.push(h.num);
      });
      return {kitabs: [...kit.values()].map(k => ({no: k.no, en: k.en, ar: k.ar, count: k.count, chapters: [...k.ch.values()]}))};
    }
    if (path === 'search') {
      const book = q.book || 'jami', t = (q.q || '').trim(), ext = book !== 'jami' && book !== 'tuhfa';
      let res = [];
      if (/^\d+$/.test(t)) {
        const n = +t;
        if (ext) { const e = extBy.get(book + '|' + n); if (e) res = [{book, num: n, demo: false, matn: e.matn.slice(0, 160), fields: ['number'], snippet: [], chapter: ''}]; }
        else { const h = byNum.get(n); if (h && (book === 'tuhfa' ? hasLayer(h) : hasJami(h))) res = [rowOf(h, book, {fields: ['number']})]; }
        return {results: res, semantic: false};
      }
      const m = t.match(/^(.+?)\s+(\d+)$/);
      if (m) { const key = resolveBook(m[1]); if (key) D.hadith.forEach(h => { if (h.refs.some(r => r.key === key && r.number === +m[2])) res.push(rowOf(h, 'jami', {fields: ['ref']})); }); }
      let total = res.length;
      if (!res.length) { res = search(t, book, q.mode); total = search.total || res.length; }
      return {results: res, total, semantic: false};
    }
    if (path === 'list') {
      const book = q.book || 'jami', lim = +(q.limit || 40), off = +(q.offset || 0);
      if (book === 'jami' || book === 'tuhfa') {
        const base = book === 'tuhfa' ? real.filter(hasLayer) : real.filter(hasJami);
        const all = base.concat(book === 'jami' ? D.hadith.filter(h => h.demo) : []);
        return {results: all.slice(off, off + lim).map(h => rowOf(h, book)), total: base.length};
      }
      const all = D.external.filter(e => e.book === book).sort((a, b) => a.num - b.num);
      return {results: all.slice(off, off + lim).map(e => ({book, num: e.num, demo: false, matn: e.matn.slice(0, 160), chapter: '', fields: [], snippet: []})), total: all.length};
    }
    if (path.startsWith('hadith/')) { const h = byNum.get(+path.slice(7)); return h ? inLang(hadithObj(h, q.book === 'tuhfa' ? 'tuhfa' : 'jami'), tl) : {error: 'not found'}; }
    if (path === 'ref') { const e = extBy.get(q.book + '|' + q.num); return e ? {matn: e.matn} : {error: 'not found'}; }
    if (path === 'ext') {
      const e = extBy.get(q.book + '|' + q.num); if (!e) return {error: 'not found'};
      const b = D.books.find(x => x.key === q.book);
      return {book: q.book, name: b ? b.name : q.book, num: +q.num, matn: e.matn.split('\n'),
              cited_by: real.filter(h => h.refs.some(r => r.key === q.book && r.number === +q.num)).map(h => h.num)};
    }
    return {error: 'unknown'};
  };
  // a translation language's layer (data/bn1.js …) is loaded the first time its book is opened
  const LOADED = {};
  window.TURATH_LANG = (l, obj) => { for (const n in obj) { const h = byNum.get(+n); if (!h) continue; const o = obj[n];
    for (const k in o.c) (h.content[k] = h.content[k] || {})[l] = o.c[k]; Object.assign(h, o.f); } };

async function vocalized0(d){

  const W=t=>new Set((t||'').replace(/[\u064b-\u0652\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').split(/[^\u0621-\u064a]+/).filter(w=>w.length>2));

  function range(kind, n) {

    else {

    }
    for (let p = from; p; p = next(p[0], p[1])) { out.push(p); if (p[0] === to[0] && p[1] === to[1]) break; }
    return out;
  }

  }
  async function showOne(b, n) {
    const box = $('#list'); box.replaceChildren();
    const lang = getLang(b); await needRange(b, 'ar', n, n); if (lang) await needRange(b, lang, n, n);

  setTimeout(() => index().catch(() => {}), 0);
  window.COLL = {
    async route(h) {
      await index();
      const m = h.match(/^#\/s\/([a-z0-9]+)(?:\/(n\/)?(\d+))?/), b = m && bookOf(m[1]);
      if (!b) { $('#list').replaceChildren(el('p', {class: 'note'}, T('nf'))); return; }
      if (b.ext) { bar(bname(b), '', true); $('#list').replaceChildren(el('div', {class: 'card'}, el('p', {}, T('cExt')), el('a', {class: 'btn lbtn', href: b.ext + '#/s/' + b.key, target: '_blank', rel: 'noopener'}, T('cOpenExt')))); return; }
      if (m[2]) return showOne(b, +m[3]);

    },
    async list() { return index(); },
    showSearch,
    showHadithSearch,
    // one hadith for the compare page: {title, text, grade, href} (or {title, ext} for a book in the other link)
    async item(key, printed, n) {
      await index(); const b = bookOf(key); if (!b) return null;
      if (b.ext) return {title: bname(b), ext: b.ext};
      const k = n || (C.rev[key] && C.rev[key][printed]) || +printed;
      await needRange(b, 'ar', k, k); if (b.langs.includes('en')) await needRange(b, 'en', k, k);
      const r = row(b, 'ar', k); if (!r) return null;
      const e = row(b, 'en', k);
      return {title: bname(b) + ' ' + fmtN(b.an[k] || k), text: r[1], grade: (e && e[2]) || r[2] || '', href: '#/s/' + key + '/n/' + k};
    },
    // every Arabic text a book has under one printed number (Muslim 899 → 899.01, 899.02 …)
    async variants(key, printed) {
      await index(); const b = bookOf(key); if (!b || b.ext) return [];
      const ns = Object.keys(b.an || {}).length ? Object.keys(b.an).filter(n => parseInt(b.an[n], 10) === +printed).map(Number) : [+printed];
      const out = []; for (const n of ns.slice(0, 8)) { await needRange(b, 'ar', n, n); const r = row(b, 'ar', n); if (r) out.push(r[1]); }
      return out;
    },
    // the text of one row (null when the book or language is not here)
    async text(key, lang, n) { await index(); const b = bookOf(key); if (!b || b.ext || !b.langs.includes(lang)) return null; await needRange(b, lang, n, n); const r = row(b, lang, n); return r ? r[1] : null; },
    async count(key) { await index(); const b = bookOf(key); return b ? b.count : 0; },
    has: k => ['bukhari', 'muslim', 'abudawud', 'tirmidhi', 'nasai', 'ibnmajah', 'malik', 'hakim'].includes(k) || !!bookOf(k),
    name: b => { if (typeof b === 'string') { b = bookOf(b); if (!b) return ''; } return bname(b); },
    // reference chip in a Jami hadith (e.g. «مسلم 1907»): show that hadith from the book, by its printed number
    async refBox(key, printed, box, linked) {
      await index(); const b = bookOf(key); if (!b) return false;
      if (b.ext) { box.append(el('p', {class: 'note'}, T('cExt')), el('a', {class: 'btn lbtn', href: b.ext + '#/s/' + b.key, target: '_blank', rel: 'noopener'}, T('cOpenExt'))); return true; }
      const n = linked || (C.rev[key] && C.rev[key][printed]) || printed, lang = getLang(b);
      await needRange(b, 'ar', n, n); if (lang) await needRange(b, lang, n, n);
      if (!row(b, 'ar', n)) { box.append(el('p', {class: 'note'}, T('cNotHere'))); return true; }
      const c = card(b, n, lang); c.querySelector('.top').append(el('a', {class: 'btn', href: '#/s/' + key + '/n/' + n}, T('cOpen')));
      box.append(c); return true;
    },
    async bookmarkCard(scope, n) { await index(); const b = bookOf(scope.slice(2)); if (!b) return null; const lang = getLang(b); await needRange(b, 'ar', n, n); if (lang) await needRange(b, lang, n, n); return card(b, n, lang); }};
})();

<script>
// موازنہ (compare): a hadith of al-Jami al-Kamil with the hadith its takhrij points to, or any hadith the reader collected.
// Routes:  #/cmp/j/<num>  the Jami hadith and its references       #/cmp  the reader's own list (any books)
// Each hadith is compared word by word with the main one: words it adds are green, words it lacks are struck through in red,
// and the part before/after the shared wording (the isnad, the author's remarks) is shown faded.
(function () {
  Object.assign(I.ur, {cmp: 'موازنہ', cmpTitle: 'احادیث کا موازنہ', cmpRefs: 'تخریج سے موازنہ', cmpAdd: 'موازنہ میں شامل کریں', cmpAdded: 'موازنہ کی فہرست میں شامل ہو گئی',
    cmpRemoved: 'موازنہ کی فہرست سے نکال دی', cmpMain: 'مرکزی حدیث', cmpMakeMain: 'مرکزی بنائیں', cmpRemove: 'نکالیں', cmpClear: 'فہرست خالی کریں',
    cmpEmpty: 'موازنہ کی فہرست خالی ہے۔ کسی بھی حدیث پر ⇄ کا بٹن دبا کر اسے یہاں شامل کریں، یا الجامع الکامل کی حدیث پر «تخریج سے موازنہ» دبائیں۔',
    cmpSame: p => 'مشابہت ' + p + '٪', cmpLegend: 'سبز: مرکزی حدیث سے زائد الفاظ — سرخ کٹے ہوئے: جو الفاظ اس روایت میں نہیں — ہلکا: سند یا مصنف کا کلام',
    cmpNone: 'اس حدیث کی تخریج میں ایسی کوئی کتاب نہیں جو ایپ میں موجود ہو۔', cmpExt: 'یہ کتاب ایپ کے دوسرے لنک میں ہے', cmpMy: 'میری موازنہ فہرست',
    cmpOpen: 'کھولیں', cmpCount: n => n + ' احادیث'});
  Object.assign(I.en, {cmp: 'Compare', cmpTitle: 'Compare hadith', cmpRefs: 'Compare with its sources', cmpAdd: 'Add to compare', cmpAdded: 'Added to the compare list',
    cmpRemoved: 'Removed from the compare list', cmpMain: 'Main hadith', cmpMakeMain: 'Make main', cmpRemove: 'Remove', cmpClear: 'Clear list',
    cmpEmpty: 'The compare list is empty. Tap ⇄ on any hadith to add it here, or “Compare with its sources” on a hadith of al-Jami al-Kamil.',
    cmpSame: p => p + '% similar', cmpLegend: 'Green: words added to the main hadith — red, struck: words missing here — faded: isnad or the author’s remarks',
    cmpNone: 'None of the books in this hadith’s takhrij is in the app.', cmpExt: 'This book is in the other link of the app', cmpMy: 'My compare list',
    cmpOpen: 'Open', cmpCount: n => n + ' hadith'});
  ICON.compare = 'M9 3L5 7l4 4V8h7V6H9V3zm6 10v3H8v2h7v3l4-4-4-4z';

  const N = n => NUM(n);
  const TASH = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
  const nw = w => w.replace(TASH, '').replace(/[\u064b-\u065f\u0670\u06d6-\u06ed\u08d3-\u08ff\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/[ىی]/g, 'ي').replace(/ک/g, 'ك').replace(/[^ء-ي]/g, '');
  const SAW = /\(?\s*(?:ﷺ|صلى الله عليه وسلم|صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ|صلى الله عليه وآله وسلم|صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ)\s*\)?/g;
  // punctuation, brackets and all harakat are left out of the comparison: (( )) . ۔ ، ! ؟ , ' ” “ « » [ ] { } ﴿ ﴾ …, َ ُ ِ ً ٌ ٍ ْ ّ ٰ ٗ ٖ ٕ ٓ …
  // a token that is only punctuation is dropped; punctuation stuck to a word is ignored in its comparison form
  const words = t => (t || '').replace(SAW, ' ﷺ ').replace(/[()\[\]{}﴿﴾«»“”"‘’'.,،؛;:!?؟۔…]+/g, m => ' ' + m + ' ').split(/\s+/).filter(Boolean)
    .map(w => ({w, n: w === 'ﷺ' ? 'ﷺ' : nw(w)})).filter(x => x.n);

  // the shared stretch of the other text: from its first to its last 3-word run that also occurs in the main text
  function window3(main, other) {
    const g = new Set(); for (let i = 0; i + 2 < main.length; i++) g.add(main[i].n + ' ' + main[i + 1].n + ' ' + main[i + 2].n);
    const pos = []; for (let i = 0; i + 2 < other.length; i++) if (g.has(other[i].n + ' ' + other[i + 1].n + ' ' + other[i + 2].n)) pos.push(i);
    if (!pos.length) return [0, other.length];
    // the densest stretch about as long as the main hadith (so a later remark that repeats a phrase is left out)
    const W = Math.max(12, Math.round(main.length * 1.4));
    let best = 0, bi = 0;
    for (let i = 0, j = 0; i < pos.length; i++) { while (j < pos.length && pos[j] - pos[i] <= W) j++; if (j - i > best) { best = j - i; bi = i; } }
    const last = pos.filter(p => p >= pos[bi] && p - pos[bi] <= W).pop();
    return [pos[bi], Math.min(other.length, last + 3)];
  }
  function lcsOps(A, B) {             // word-level diff of A (main) and B (other): [['=',w],['+',w],['-',w]]
    const m = A.length, n = B.length, L = Array.from({length: m + 1}, () => new Uint16Array(n + 1));
    for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i].n && A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < m && j < n) {
      if (A[i].n && A[i].n === B[j].n) { ops.push(['=', B[j].w]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { ops.push(['-', A[i].w]); i++; }
      else { ops.push(['+', B[j].w]); j++; }
    }
    while (i < m) ops.push(['-', A[i++].w]);
    while (j < n) ops.push(['+', B[j++].w]);
    return {ops, same: L[0][0]};
  }
  function diffNode(mainText, otherText) {
    const A = words(mainText).slice(0, 700), Ball = words(otherText).slice(0, 1400);
    const [a, z] = window3(A, Ball), B = Ball.slice(a, z), {ops, same} = lcsOps(A, B);
    const p = el('p', {class: 'cmptext', lang: 'ar', dir: 'rtl'});
    if (a > 0) p.append(el('span', {class: 'cmpfade'}, Ball.slice(0, a).map(x => x.w).join(' ') + ' '));
    ops.forEach(([o, w]) => p.append(o === '=' ? w : el(o === '+' ? 'ins' : 'del', {}, w), ' '));
    if (z < Ball.length) p.append(el('span', {class: 'cmpfade'}, Ball.slice(z).map(x => x.w).join(' ')));
    const pct = A.filter(x => x.n).length ? Math.round(100 * same / A.filter(x => x.n).length) : 0;
    return {node: p, pct};
  }

  // ---- basket (my compare list) ----
  const load = () => { try { const a = JSON.parse(localStorage.cmp || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const save = a => { try { localStorage.cmp = JSON.stringify(a.slice(0, 30)); } catch (e) {} };
  const same = (x, y) => x.k === y.k && String(x.n) === String(y.n);
  function toggle(item) {
    const a = load(), i = a.findIndex(x => same(x, item));
    if (i >= 0) { a.splice(i, 1); toast(T('cmpRemoved')); } else { a.push(item); toast(T('cmpAdded')); }
    save(a); return i < 0;
  }
  function button(item) {     // ⇄ button for a hadith card
    const b = el('button', {class: 'ab cmpb', type: 'button', title: T('cmpAdd'), 'aria-label': T('cmpAdd')}, icon('compare'));
    const paint = () => b.classList.toggle('on', load().some(x => same(x, item)));
    b.addEventListener('click', () => { toggle(item); paint(); }); paint();
    return b;
  }

  // ---- text of one hadith: {title, text, grade, href, ext} ----
  async function getItem(it) {
    if (it.k === 'jami') {
      const d = await api('hadith/' + it.n + '?book=jami');
      if (d.error) return null;
      return {title: T('jamiName') + ' ' + N(d.num), text: (d.matn || []).join(' '), sanad: d.sanad, grade: d.grade, href: '#/h/' + d.num, refs: d.refs || []};
    }
    return COLL.item(it.k, it.p, it.n);
  }

  function itemCard(x, extra) {
    const c = el('article', {class: 'card cmpcard'});
    c.append(el('div', {class: 'top'}, el('b', {class: 'cmph'}, x.title), extra || '', el('span', {class: 'sp'}),
      x.href ? el('a', {class: 'btn', href: x.href}, T('cmpOpen')) : ''));
    if (x.grade) c.append(el('p', {class: 'cs agrade', lang: 'ar'}, x.grade));
    return c;
  }

  async function render(main, others, box, controls) {
    const m = itemCard(main, el('span', {class: 'tag cmptag'}, T('cmpMain')));
    if (main.sanad) m.append(el('p', {class: 'cmptext cmpfade', lang: 'ar'}, main.sanad));
    m.append(el('p', {class: 'cmptext', lang: 'ar', dir: 'rtl'}, main.text));
    if (controls) m.append(controls(main));
    box.append(m, el('p', {class: 'note cmplegend'}, T('cmpLegend')));
    for (const o of others) {
      if (!o) continue;
      if (o.ext) { box.append(el('div', {class: 'card'}, el('b', {}, o.title), el('p', {class: 'note'}, T('cmpExt')), el('a', {class: 'btn lbtn', href: o.ext, target: '_blank', rel: 'noopener'}, T('cOpenExt')))); continue; }
      const {node, pct} = diffNode(main.text, o.text);
      const c = itemCard(o, el('span', {class: 'tag cmppct' + (pct >= 80 ? ' hi' : pct >= 50 ? ' mid' : ' lo')}, T('cmpSame')(N(pct))));
      c.append(node);
      if (controls) c.append(controls(o));
      box.append(c);
    }
  }

  async function showRefs(num) {
    bar(T('cmpRefs'), T('jamiName') + ' ' + N(num), true);
    const box = $('#list'); box.replaceChildren(el('p', {class: 'note'}, T('loading')));
    const main = await getItem({k: 'jami', n: num});
    if (!main) { box.replaceChildren(el('p', {class: 'note'}, T('nf'))); return; }
    const seen = new Set(), refs = main.refs.filter(r => COLL.has(r.key) && !seen.has(r.key + '|' + (r.n || r.number)) && seen.add(r.key + '|' + (r.n || r.number)));
    const others = await Promise.all(refs.map(r => COLL.item(r.key, r.number, r.n).catch(() => null)));
    box.replaceChildren();
    if (!others.some(Boolean)) { box.append(el('p', {class: 'note'}, T('cmpNone'))); }
    await render(main, others, box);
  }

  async function showList() {
    bar(T('cmpTitle'), T('cmpMy'), true);
    const box = $('#list'); box.replaceChildren();
    let a = load();
    if (!a.length) { box.append(el('p', {class: 'note'}, T('cmpEmpty'))); return; }
    box.append(el('p', {class: 'note'}, T('loading')));
    const items = await Promise.all(a.map(x => getItem(x).then(v => v && Object.assign(v, {_it: x})).catch(() => null)));
    box.replaceChildren(el('div', {class: 'gsbar'}, el('button', {class: 'chip', type: 'button', on: {click: () => { save([]); showList(); }}}, T('cmpClear'))));
    const ok = items.filter(Boolean); if (!ok.length) { box.append(el('p', {class: 'note'}, T('cmpEmpty'))); return; }
    const controls = x => el('div', {class: 'acts'},
      x === ok[0] ? '' : el('button', {class: 'chip', type: 'button', on: {click: () => { save([x._it].concat(load().filter(y => !same(y, x._it)))); showList(); }}}, T('cmpMakeMain')),
      el('button', {class: 'chip', type: 'button', on: {click: () => { save(load().filter(y => !same(y, x._it))); showList(); }}}, T('cmpRemove')));
    await render(ok[0], ok.slice(1), box, controls);
  }

  window.CMP = {
    button, toggle, count: () => load().length,
    route(h) { const m = h.match(/^#\/cmp\/j\/(\d+)/); return m ? showRefs(+m[1]) : showList(); }};
})();

<script>
/* زر «تشکیل»: يخفي حركات الحديث العربي ويعيدها عند الضغط ثانية (القرآن لا يتأثر) */
(function () {
  const KEY = 'harakatOff', RE = /[ً-ٰٟۖ-ۭ]/g, HAS = /[ً-ٰٟ]/;
  const LBL = {ur: 'تشکیل', ar: 'التشكيل', en: 'Harakat', bn: 'হারাকাত', hi: 'हरकत', gu: 'હરકત', fr: 'Harakat'};
  let off = false; try { off = localStorage.getItem(KEY) === '1'; } catch (e) {}
  const orig = new Map(); let btn, pend = false;
  const skip = n => { const p = n.parentElement; return !p || p.closest('.qar,.qv,.ayah,script,style,input,textarea,.harakat-btn,[data-keeph]'); };
  function strip(root) {
    root.querySelectorAll('.ar,[lang=ar]').forEach(r => {
      if (r.closest('.qar,.qv,.ayah,[data-keeph]')) return;
      const w = document.createTreeWalker(r, NodeFilter.SHOW_TEXT);
      for (let n = w.nextNode(); n; n = w.nextNode()) {
        if (orig.has(n) || !HAS.test(n.nodeValue) || skip(n)) continue;
        orig.set(n, n.nodeValue); n.nodeValue = n.nodeValue.replace(RE, '');
      }
    });
  }
  function restore() { orig.forEach((v, n) => { n.nodeValue = v; }); orig.clear(); }
  function apply() { if (off) strip(document.body); }
  function sched() { if (pend || !off) return; pend = true; requestAnimationFrame(() => { pend = false; orig.forEach((v, n) => { if (!n.isConnected) orig.delete(n); }); strip(document.body); }); }
  function show() {
    const h = location.hash, hide = /^#\/(q|quiz)(\/|$)/.test(h) || h === '#/q';
    if (btn) btn.style.display = hide ? 'none' : '';
  }
  function label() { const L = document.documentElement.lang || 'ur'; return LBL[L] || LBL.ur; }
  function paint() { if (!btn) return; btn.textContent = label(); btn.setAttribute('aria-pressed', String(off)); btn.classList.toggle('on', off); }
  function init() {
    const st = document.createElement('style');
    st.textContent = '.harakat-btn{position:fixed;inset-inline-start:.7rem;bottom:4.9rem;z-index:40;border:1px solid var(--line,#d9d2c3);background:var(--card,#fff);color:var(--accent,#0b5d4b);border-radius:999px;padding:.35rem .9rem;font:600 1rem/1.6 var(--urdu,serif);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;opacity:.92}.harakat-btn.on{background:var(--accent,#0b5d4b);color:#fff}html.sheetopen .harakat-btn{display:none}';
    document.head.appendChild(st);
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'harakat-btn';
    btn.onclick = () => { off = !off; try { localStorage.setItem(KEY, off ? '1' : '0'); } catch (e) {} if (off) strip(document.body); else restore(); paint(); };
    document.body.appendChild(btn); paint(); show(); apply();
    new MutationObserver(() => { sched(); const l = label(); if (btn.textContent !== l) paint(); }).observe(document.body, {childList: true, subtree: true});
    addEventListener('hashchange', show);
  }
  if (document.body) init(); else addEventListener('DOMContentLoaded', init);
})();
